<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <radialGradient id="shine" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="110" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="110" fill="url(#shine)"/>

  <circle cx="128" cy="128" r="82"
          fill="none"
          stroke="white"
          stroke-width="10"
          stroke-opacity="0.95"/>

  <circle cx="128" cy="128" r="96"
          fill="none"
          stroke="white"
          stroke-opacity="0.18"
          stroke-width="3"/>

  <line x1="128" y1="128" x2="128" y2="72"
        stroke="white" stroke-width="12"
        stroke-linecap="round"/>

  <line x1="128" y1="128" x2="170" y2="128"
        stroke="white" stroke-width="9"
        stroke-linecap="round"/>

  <circle cx="128" cy="128" r="11" fill="white"/>

  <circle cx="128" cy="128" r="108"
          fill="none"
          stroke="white"
          stroke-opacity="0.10"
